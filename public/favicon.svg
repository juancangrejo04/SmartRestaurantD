    <path d="M11 3 L11 12" stroke="#E8A33D" stroke-width="2" stroke-linecap="round"/>
    <path d="M15 3 L15 12" stroke="#E8A33D" stroke-width="2" stroke-linecap="round"/>
    <path d="M19 3 L19 12" stroke="#E8A33D" stroke-width="2" stroke-linecap="round"/>
    
