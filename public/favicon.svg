    <!-- Fork -->
    <path d="M7 3 L7 13 C7 16 10 18 13 18 L13 33 C13 34.5 14.5 35 15 35 C15.5 35 17 34.5 17 33 L17 18 C20 18 23 16 23 13 L23 3" 
